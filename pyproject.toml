[project]
name = "galleriadelvento"
version = "0.1.0"
description = "Galleria del vento 2D in tempo reale per sezioni, schizzi e profili"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "umas97" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    # Draws the placeholder icons (packaging/make_icons.py).
    "pillow>=11.0",
]

[project.scripts]
galleriadelvento = "gdv.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gdv"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]
# Markdown too: recent ruff formats code blocks inside .md, and the SPEC is prose.
extend-exclude = ["frontend", "packaging", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
