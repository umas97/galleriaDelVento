<!doctype html>

    <title>galleriaDelVento non è in esecuzione</title>
    <style>

      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.25rem; font-weight: 600; color: #f5f5f5; margin: 0 0 0.75rem; }

        margin-top: 1rem; background: #2d2d2d; color: #f5f5f5; border: 1px solid #3f3f3f;
        border-radius: 0.375rem; padding: 0.5rem 1rem; font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>galleriaDelVento non è in esecuzione</h1>

      <button onclick="location.reload()">Riprova</button>
